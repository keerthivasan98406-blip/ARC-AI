<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arc AI | Production Glassmorphic AI OS</title>
  
  <meta name="description" content="Arc AI - Next-Generation AI Assistant with Multi-Model Intelligence, Vision, Document Intelligence, Image Generation Studio, and Real-Time Web Search.">
  <meta name="keywords" content="Arc AI, AI Assistant, GPT-5, Claude 3.5, Gemini 1.5 Pro, DeepSeek R1, Llama 3.3, Glassmorphism AI">
  <meta name="author" content="Arc AI Neural Labs">
  <meta name="theme-color" content="#1a1625">
  
  <meta property="og:title" content="Arc AI | Next-Gen Glassmorphic AI OS">
  <meta property="og:description" content="Production-grade AI Assistant OS powered by Multi-Model Engines">
  <meta property="og:type" content="website">
  
  <link rel="icon" type="image/svg+xml" href="/arc_ai_logo.svg" />
  <link rel="alternate icon" type="image/png" href="/arc_ai_logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  
  <!-- All styles are bundled locally via Vite — no CDN required, works offline -->
  <link rel="stylesheet" href="/sidebar-icons.css" />
</head>
<body class="bg-[#030108] text-[#F8FAFC] font-sans antialiased overflow-hidden selection:bg-[#A855F7]/30 selection:text-white">
  <!-- cinematic-env is hidden until Tailwind loads to prevent unstyled flash -->
  <div class="cinematic-env" style="opacity:0;transition:opacity 0.3s ease;" id="cinematic-bg">
    <div class="cinematic-grain"></div>

    <div class="floating-panel panel-1">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-brain"></i></div>
        <div class="panel-title">Neural Activity</div>
        <div class="panel-value">98.7%</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:87%"></div></div>
      </div>
    </div>

    <div class="floating-panel panel-2">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-code"></i></div>
        <div class="panel-title">Code Preview</div>
        <div class="panel-value">Active</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:64%"></div></div>
      </div>
    </div>

    <div class="floating-panel panel-3">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-image"></i></div>
        <div class="panel-title">Image Gen</div>
        <div class="panel-value">Ready</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:52%"></div></div>
      </div>
    </div>

    <div class="floating-panel panel-4">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-chart-line"></i></div>
        <div class="panel-title">Analytics</div>
        <div class="panel-value">Live</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:73%"></div></div>
      </div>
    </div>

    <div class="floating-panel panel-5">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-bolt"></i></div>
        <div class="panel-title">Model Status</div>
        <div class="panel-value">GPT-5</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:91%"></div></div>
      </div>
    </div>

    <div class="floating-panel panel-6">
      <div class="panel-inner">
        <div class="panel-icon"><i class="fas fa-satellite"></i></div>
        <div class="panel-title">Web Intel</div>
        <div class="panel-value">Online</div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:45%"></div></div>
      </div>
    </div>
  </div>

  <div id="root" class="relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
