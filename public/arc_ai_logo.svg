<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#C0C0C0" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="52" fill="url(#bgGrad)" stroke="#C0C0C0" stroke-width="1.5"/>

  <!-- Stylized "A" logo mark -->
  <g transform="translate(20, 22)">
    <!-- Left diagonal -->
    <path d="M 20 60 L 8 10 L 13 10 L 22 48 L 31 10 L 36 10 L 24 60 Z" fill="url(#arcGrad)" filter="url(#glow)"/>
    <!-- Crossbar -->
    <rect x="14" y="32" width="16" height="4" rx="2" fill="#050505"/>
  </g>

  <!-- "Arc AI" text -->
  <g transform="translate(20, 88)">
    <!-- Arc -->
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">Arc</text>
    <!-- AI -->
    <text x="38" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#C0C0C0" letter-spacing="2">AI</text>
  </g>
</svg>